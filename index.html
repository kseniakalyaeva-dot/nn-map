К сожалению, с Яндексом это невозможно: они не предоставляют бесплатный публичный слой для карт на сайтах без регистрации и ключа.

Но есть отличный вариант — карта от **2ГИС**. У них есть специальный сервис *«ДубльГИС»*, который позволяет бесплатно показывать карту России на вашем сайте без ключей и ограничений по трафику.
