<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Маршруты по Нижнему Новгороду</title>
    
    <!-- Библиотека карт -->
    <link rel="stylesheet" href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css'>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-locales@latest/dist/ru.css">
    <script src="https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-locales@latest/dist/ru.js"></script>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, sans-serif;
      }

      #map {
        width: 100vw;
        height: 100vh;
      }

      /* Боковая панель */
      .panel {
        position: absolute;
        top: 10px;
        left: 10px;
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        display: grid;
        gap: 15px;
        max-width: 360px;
      }

      h2 { 
        grid-column: 1 / -1; 
        margin: 0 0 10px 0; 
        font-size: 16px; 
        color: #333; 
        text-align: center;
      }
      
      button {
        width: 100%;
        text-align: left;
        padding: 10px;
        margin-bottom: 6px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 14px;
        line-height: 1.4;
      }

      button:hover {
        background: #f0f0f0;
        border-color: #007bff;
      }

      /* Цвета активных кнопок */
      .active-a { background: #d4edda !important; border-color: #155724 !important; font-weight: bold; }
      .active-b { background: #f8d7da !important; border-color: #721c24 !important; font-weight: bold; }

      /* Блок с маршрутом */
      .route-info {
        grid-column: 1 / -1;
        padding: 10px;
        border-top: 1px dashed #ddd;
        font-size: 14px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease-in-out;
      }

      .route-info.active {
        opacity: 1;
        visibility: visible;
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <h2>🏃‍♂️ Откуда</h2>
      <div id="list-a"></div>
      <hr style="border: none; border-top: 2px dashed #eee; margin: 15px 0;" />
      <h2>📍 Куда</h2>
      <div id="list-b"></div>
      <!-- Здесь будет информация о времени пути -->
      <div class="route-info">Путь не построен.</div>
    </div>

    <div id="map"></div>

    <script>
      // ВАШ ПОЛНЫЙ СПИСОК ИЗ 9 ТОЧЕК 👇
      const points = [
        {id: 1, name: 'Нижегородский кремль', coords: [56.328624, 44.002842]}, // Точка №1
        {id: 2, name: 'Чкаловская лестница', coords: [56.33083, 44.00944]},
        {id: 3, name: 'Улица Большая Покровская', coords: [56.317088, 43.994829]},
        {id: 4, name: 'Рождественская церковь', coords: [56.327343, 43.985028]},
        {id: 5, name: 'Нижегородская ярмарка', coords: [56.3284456049, 43.9611679730]},
        {id: 6, name: 'Набережная Федоровского', coords: [56.326348, 43.987481]},
        {id: 7, name: 'Памятник Минину', coords: [56.326761, 44.006844]},
        {id: 8, name: 'Александро-Невский собор', coords: [56.3336, 43.97118]},
        {id: 9, name: 'Канатная дорога', coords: [56.323611, 44.039167]}
      ];

      let map;
      let selectedA = null;
      let selectedB = null;

      function initMap() {
        const options = {
          zoom: 13,
          center: new mapboxgl.LngLat(43.995, 56.327),
          mapTypeId: "roadmap"
        };

        map = new mapboxgl.Map({
          container: 'map',
          style: 'mapbox://styles/autoscale/cj8f54g6h000i1cpk9u49w779', // Русскоязычная карта OSM
          locale: 'ru'
        });

        renderLists();
        placeStaticMarkers(); // Ставит метки всех точек сразу при загрузке страницы
      }

      function clearOldRoute() {
        if (!map) return;
        let routes = map.data.getFeatureRoot().getChildFeatures();
        for (let route of routes) {
          map.data.remove(route);
        }
      }

      function buildRoute(fromCoords, toCoords) {
        clearOldRoute();
        
        const directionsService = new mapboxgl.DirectionsService();
        const directionsRenderer = new mapboxgl.DirectionsRenderer({
          suppressMarkers: true,
          polylineOptions: {
            strokeColor: '#007bff',
            strokeWeight: 6
          },
          map: map
        });

        directionsService.route(
          {
            origin: fromCoords.reverse(), // Для Mapbox координаты меняются местами!
            destination: toCoords.reverse(),
            travelMode: mapboxgl.TravelMode.WALKING
          },
          (response, status) => {
            if (status === "OK") {
              directionsRenderer.setDirections(response);
              map.fitBounds(directionsRenderer.getBounds());
            } else {
              alert("Не удалось построить маршрут");
            }
          }
        );
      }

      function renderLists() {
        const containerA = document.getElementById('list-a');
        const containerB = document.getElementById('list-b');

        points.forEach((point, index) => {
          // Кнопки выбора СТАРТА
          const btnA = document.createElement('button');
          btnA.textContent = `${index + 1}. ${point.name}`;
          btnA.onclick = () => {
            clearActiveButtons();
            selectedA = point.coords;
            btnA.classList.add('active-a');
            
            if (selectedB) {
              buildRoute(selectedA, selectedB);
            } else {
              map.panTo([...point.coords].reverse()); // Для Mapbox меняем порядок координат
            }
          };
          containerA.appendChild(btnA);

          // Кнопки выбора ФИНИША
          const btnB = document.createElement('button');
          btnB.textContent = `${index + 1}. ${point.name}`;
          btnB.onclick = () => {
            if (!selectedA) return;
            clearActiveButtons();
            selectedB = point.coords;
            btnB.classList.add('active-b');
            buildRoute(selectedA, selectedB);
          };
          containerB.appendChild(btnB);
        });
      }

      function clearActiveButtons() {
        document.querySelectorAll('#list-a button, #list-b button')
          .forEach((btn) =>
            btn.classList.remove('active-a', 'active-b'));
      }

      function placeStaticMarkers() {
        points.forEach(p => {
          new mapboxgl.Marker()
            .setLngLat([p.coords[1], p.coords[0]]) // Меняем порядок координат
            .setPopup(new mapboxgl.Popup({closeButton: false}).setHTML(`<b>${p.name}</b>`))
            .addTo(map);
        });
      }

      window.onload = initMap;
    </script>
  </body>
</html>
